repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
        exclude: ^(testing/projects/|examples/|dependabot_check/)
    -   id: end-of-file-fixer
        exclude: ^(testing/projects/|examples/|dependabot_check/)
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-ast
    -   id: check-toml

-   repo: https://github.com/psf/black
    rev: 24.4.0
    hooks:
    -   id: black
        exclude: ^(testing/projects/|examples/|dependabot_check/)

-   repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.3.4
    hooks:
    -   id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^(testing/projects/|examples/|dependabot_check/)

-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
    -   id: isort
        name: isort (python)
        exclude: ^(testing/projects/|examples/|dependabot_check/)

-   repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
    -   id: flake8
        additional_dependencies: [flake8-docstrings]
        exclude: ^(testing/projects/|examples/|dependabot_check/)

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
    -   id: mypy
        # `packaging`, `tomli`, `certifi` and `rich` are real runtime
        # dependencies; the hook runs in its own isolated env, so it needs them
        # too or `scoring` fails import resolution, `parsers.toml` degrades to
        # `Any`, `secure_http` cannot resolve the CA bundle it pins TLS
        # against, and `cli.formatter` returns `Any` from three functions
        # declared `-> str`. That last one was invisible until #154 unmasked
        # `cli.*`; installing the dependency is the fix, not an
        # `ignore_missing_imports` override, which would mask it again.
        additional_dependencies:
        -   types-PyYAML
        -   types-requests
        -   packaging>=23.2
        -   tomli>=2.0.1
        -   certifi>=2024.7.4
        -   rich>=13.5.0
        args: [src]
        exclude: ^(testing/|venv/|build/|dist/|setup.py)
        pass_filenames: false

-   repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
    -   id: bandit
        args: ["-r", "src/", "-c", ".bandit.yml"]
        exclude: ^(testing/|tests/|venv/|build/|dist/)
        pass_filenames: false
