# Bandit configuration file for dependency-risk-profiler
# This file configures the bandit security scanner to ignore certain low-severity issues

# Skip the following tests (with justification):
# B105: bandit 1.9.x flags the empty-string defaults for the OPTIONAL "github_token"
#       and "nvd_api_key" config keys (config.py DEFAULT_CONFIG) as "possible hardcoded
#       password". They are empty placeholders for optional API credentials, supplied at
#       runtime via env vars (DRP_GITHUB_TOKEN / DRP_NVD_API_KEY) or CLI flags — no secret
#       is embedded. Verified false positive; skipping keeps CI (bandit 1.9.x) consistent
#       with the pinned pre-commit hook. (Switching the defaults to None was rejected: it
#       emits invalid `= None` TOML from `generate-config`.)
# B110: Try/except/pass is used in several places where exceptions are expected and can be safely ignored
# B112: Try/except/continue is used in several places where exceptions are expected and iteration should continue
# B404: Import of subprocess module - required for functionality
# B603: subprocess call - our calls use arrays and don't use shell=True, which mitigates risks
# B607: Partial path - we only use well-known commands like git, not user input
# B405/B314: xml.etree is used ONLY in parsers/xml_utils.py to read NuGet .csproj /
#       Maven pom.xml manifests. ElementTree does not resolve external entities (no
#       XXE), and read_xml_root() caps input size to bound entity-expansion cost, so
#       parsing these manifests is safe without adding a defusedxml dependency.

skips: ['B105', 'B110', 'B112', 'B314', 'B404', 'B405', 'B603', 'B607']

# Configure test directory exclusion
exclude_dirs: ['testing']

# Configure test method inclusion
# only_includes: []

# Set a severity threshold
# severity_level: LOW

# Set a confidence threshold
# confidence_level: HIGH
