# gitleaks configuration.
#
# The default ruleset is used in full. This file records only the values that
# are deliberately credential-shaped, with the reason each one is here -- an
# allowlist entry without a reason is indistinguishable from a mistake.

[extend]
useDefault = true

[allowlist]
description = "Deliberately credential-shaped values, and paths that are not ours."

# Vendored dependencies and build output. Not committed; scanned only when a
# working tree is swept.
paths = [
  '''(^|/)\.venv/''',
  '''(^|/)venv/''',
  '''(^|/)node_modules/''',
  '''(^|/)htmlcov/''',
  '''(^|/)\.mypy_cache/''',
  '''(^|/)\.pytest_cache/''',
  # The scanner's own canary: a never-issued key the CI step scans first to
  # prove the scan can fail. Allowlisted here so the tree scan stays clean;
  # the canary run reads it from a scratch path this pattern does not match,
  # so the proof still runs against this config rather than around it.
  '''(^|/)\.github/secret-scan-canary\.txt$''',
]

# `FieldSource` must refuse anything that could carry a secret, and the only
# way to assert that is to hand it strings shaped like secrets. The token below
# is a counting sequence. Deleting it would delete the test that keeps real
# credentials out of serialized provenance.
#
# Maven fixture filenames trip `generic-api-key` on entropy alone -- the rule
# sees a quoted `slf4j-parent.pom` next to an assignment and scores it 3.88.
# Narrowed to the two extensions the conformance fixtures actually name, so a
# real credential does not slip through by ending in a word this matches.
regexes = [
  '''ghp_0123456789abcdefghij''',
  '''REDACTED-THIRD-PARTY-[A-Z-]+''',
  '''[A-Za-z0-9._-]+\.(pom|metadata)''',
]
