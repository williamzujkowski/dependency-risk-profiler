name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Run when tag matches v*, i.e. v1.0.0, v0.1.0

permissions:
  contents: write
  id-token: write  # Required for trusted publishing to PyPI

jobs:
  build-and-publish:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0  # We need the full history for the changelog

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel twine
        pip install -e .

    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

    - name: Generate Release Notes
      id: changelog
      run: |
        echo "# Release v${{ env.VERSION }}" > RELEASE_NOTES.md
        echo "" >> RELEASE_NOTES.md
        echo "## What's Changed" >> RELEASE_NOTES.md
        git log --pretty=format:"* %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD | grep -v "Merge pull request" >> RELEASE_NOTES.md
        echo "" >> RELEASE_NOTES.md
        echo "## Verification" >> RELEASE_NOTES.md
        echo "SHA256 checksums are published for every artifact attached to this release." >> RELEASE_NOTES.md
        echo "The PyPI distribution is published via trusted publishing (OIDC) with Sigstore attestations." >> RELEASE_NOTES.md
        echo "" >> RELEASE_NOTES.md
        echo '```bash' >> RELEASE_NOTES.md
        echo "# Verify checksums of the artifacts downloaded from this release" >> RELEASE_NOTES.md
        echo "sha256sum -c SHA256SUMS.txt" >> RELEASE_NOTES.md
        echo "" >> RELEASE_NOTES.md
        echo "# Verify the PyPI attestation (Sigstore)" >> RELEASE_NOTES.md
        echo "pip install sigstore && python -m sigstore verify identity \\" >> RELEASE_NOTES.md
        echo "  --cert-identity https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/v${{ env.VERSION }} \\" >> RELEASE_NOTES.md
        echo "  --cert-oidc-issuer https://token.actions.githubusercontent.com dependency_risk_profiler-*.whl" >> RELEASE_NOTES.md
        echo '```' >> RELEASE_NOTES.md
        echo "" >> RELEASE_NOTES.md
        echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$(git describe --tags --abbrev=0 HEAD^)...v${{ env.VERSION }}" >> RELEASE_NOTES.md
        cat RELEASE_NOTES.md

    - name: Build package
      run: |
        python -m build
        twine check dist/*

    - name: Checksum package artifacts
      run: |
        cd dist && sha256sum *.tar.gz *.whl > SHA256SUMS.txt

    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        name: Release v${{ env.VERSION }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false
        files: |
          dist/*.tar.gz
          dist/*.whl
          dist/SHA256SUMS.txt

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (head of release/v1)
      with:
        # Use trusted publishing (OIDC) instead of token authentication
        # No need for user/password with trusted publishing
        skip-existing: true
        verbose: true
        packages-dir: dist
        verify-metadata: true
        # Enable attestations for trusted publishing
        attestations: true

    - name: Build docs
      run: |
        pip install -e ".[docs]"
        mkdocs build

    - name: Deploy docs
      uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
      with:
        folder: site
        branch: gh-pages
        clean: true
