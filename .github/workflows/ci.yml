name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip 'setuptools==69.0.2' 'wheel>=0.42.0'
        pip install -e ".[dev]"

    - name: Lint with flake8
      run: flake8 --config=.flake8

    - name: Type check with mypy
      run: mypy src

    - name: Test with pytest
      run: pytest testing/unit testing/integration --cov=src --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
      with:
        file: ./coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip 'setuptools==69.0.2' 'wheel>=0.42.0'
        pip install bandit uv

    # `uv.lock` is committed but nothing installs from it (#232), so on its own
    # it is a file that looks like a pin and is not one. This step is the half
    # that can land safely today: it fails if the lockfile has drifted out of
    # agreement with pyproject.toml, which is what happens when someone edits a
    # dependency and never relocks. It does NOT make CI reproducible — the test
    # job still resolves from PyPI with pip. See #232 for that half.
    - name: Check uv.lock agrees with pyproject.toml
      run: uv lock --check

    - name: Run security checks
      run: |
        bandit -r src -c .bandit.yml
        # safety check is deprecated, use a more modern approach
        echo "Skipping safety dependency check due to known compatibility issues with recent versions"
        echo "Using bandit for security scanning instead"
