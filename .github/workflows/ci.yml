name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip 'setuptools==69.0.2' 'wheel>=0.42.0'
        pip install -e ".[dev]"

    - name: Lint with flake8
      run: flake8 --config=.flake8

    - name: Type check with mypy
      run: mypy src research

    - name: Test with pytest
      run: pytest testing/unit testing/integration --cov=src --cov-report=xml


  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip 'setuptools==69.0.2' 'wheel>=0.42.0'
        pip install bandit uv

    # `uv.lock` is committed but nothing installs from it (#232), so on its own
    # it is a file that looks like a pin and is not one. This step is the half
    # that can land safely today: it fails if the lockfile has drifted out of
    # agreement with pyproject.toml, which is what happens when someone edits a
    # dependency and never relocks. It does NOT make CI reproducible — the test
    # job still resolves from PyPI with pip. See #232 for that half.
    - name: Check uv.lock agrees with pyproject.toml
      run: uv lock --check

    # Bandit is a static analyser of OUR OWN source. It says nothing whatsoever
    # about dependencies. Two `echo` lines used to sit here claiming otherwise —
    # "Using bandit for security scanning instead" — which made this job's name
    # promise coverage the job does not have. Deleted rather than reworded: a
    # build step whose output is a claim about what it is not doing is worse
    # than silence. Real dependency scanning is #234; the honest state until
    # then is that this job checks our code and the lockfile, and nothing else.
    - name: Run security checks
      run: bandit -r src -c .bandit.yml

    # Bandit reads our source for unsafe constructs; it does not look for
    # credentials. Conformance fixtures are captured verbatim from real
    # third-party projects (rule 5), so a capture can pick up a real key --
    # Signal's Android build file carried a Maps key and two Stripe
    # publishable keys, and GitHub's own scanner found them before anything
    # here did. This is the gate at the boundary rather than a check inside
    # each capture script.
    # Scan the WORKING TREE, not the pull request's diff.
    #
    # gitleaks-action scans a commit range on pull_request events. Two things
    # were wrong with that, and the first hid the second:
    #
    #   1. The range never resolved. actions/checkout fetches shallow, so
    #      `<base>^` is not in the local object store, git errored, and the
    #      scan reported `scanned ~0 bytes (0)` followed by `no leaks found`.
    #      A clean verdict over zero bytes is rule 6 exactly: a required check
    #      that does not analyse its own subject. It went red here only
    #      because the action surfaced git's exit code -- the scanner's own
    #      answer was a pass.
    #
    #   2. Even resolved, a diff scan cannot find a secret that is already in
    #      the tree. Signal's key entered in b43e41e and was redacted in
    #      ec45676; every PR in between was legitimately clean under a diff
    #      scan, because the key was in no PR's diff. That is why GitHub's
    #      scanner found it and this job did not.
    #
    # `--no-git --source .` reads every file that is about to be merged, so
    # neither failure mode is expressible. Run the binary directly rather than
    # through the action: the action's only remaining value was installing it,
    # its scan mode is not overridable, and dropping it takes a third-party
    # JavaScript action holding GITHUB_TOKEN out of this job.
    - name: Scan for secrets
      env:
        GITLEAKS_VERSION: 8.24.3
        GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
      run: |
        set -euo pipefail
        tarball="$RUNNER_TEMP/gitleaks.tar.gz"
        curl -sSfL -o "$tarball" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
        tar xz -f "$tarball" -C "$RUNNER_TEMP" gitleaks

        # Prove the scanner bites before trusting it to pass. A scanner that
        # cannot fail is indistinguishable from one that found nothing, and
        # that is the shape of every silent-pass defect this repo has had.
        # The canary runs under the same --config as the real scan, so it
        # tests the deployed configuration rather than stock gitleaks: an
        # allowlist widened until it swallows everything fails here too.
        canary="$RUNNER_TEMP/canary"
        mkdir -p "$canary"
        cp .github/secret-scan-canary.txt "$canary/planted.txt"
        if "$RUNNER_TEMP/gitleaks" detect --no-git --source "$canary" \
             --config "$GITHUB_WORKSPACE/.gitleaks.toml" --redact --no-banner; then
          echo "::error::secret scan did not flag a planted credential -- the scanner is not working, so its verdict on the tree means nothing"
          exit 1
        fi

        "$RUNNER_TEMP/gitleaks" detect --no-git --source . \
          --config .gitleaks.toml --redact -v --no-banner
