# Dependabot configuration file
# See documentation: https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# ---------------------------------------------------------------------------
# What this file does and does not control
# ---------------------------------------------------------------------------
#
# This file configures **version updates** only. It has no effect whatsoever on
# **security updates**, which are a repository setting:
#
#     $ gh api repos/williamzujkowski/dependency-risk-profiler/automated-security-fixes
#     {"enabled":true,"paused":false}
#
# Security updates run against everything in the dependency graph and are not
# scoped by `directory`, `directories`, or anything else writable here. There is
# no `exclude-paths` key; `directories` (plural) takes globs but not negation.
#
# A previous version of this comment claimed that `directory: "/"` kept the
# scan fixtures under testing/projects/ out of scope. It did not, and four PRs
# proved it — #17 (/testing/projects/gin), #18 and #229 (/testing/projects/
# flask/requirements), #19 (/testing/projects/express) — three of them opened
# while this file was syntactically invalid and no version update could run at
# all. They never needed this file. #231 has the full diagnosis.
#
# What has been observed, rather than read off the docs:
#
#   * `directory: "/"` does NOT recurse for version updates. #195 bumped the
#     aiohttp range in the root pyproject.toml and touched nothing under
#     examples/ or testing/, both of which hold pip manifests.
#   * Security updates DO reach every manifest in the graph regardless. #241
#     targeted testing/projects/flask/requirements with no config entry within
#     a mile of it.
#
# So the only durable way to keep a file out of Dependabot's way is to keep it
# out of the dependency graph. #231 did that by deleting the vendored
# testing/projects/ checkout no test ever read, and by bringing
# examples/manifests/ current so its alerts resolve rather than accumulate.
#
# ---------------------------------------------------------------------------
# Why there is no npm or gomod entry
# ---------------------------------------------------------------------------
#
# There is no package.json and no go.mod at the repository root, so entries for
# them enrolled nothing. They sat here looking like coverage. If a root
# manifest for either ever appears, add the entry then — and confirm it works
# by watching for a PR, not by re-reading this file.

version: 2
updates:
  # Reads the root pyproject.toml. Observed working: #195.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps the commit-SHA pins in .github/workflows/ current (#186). Pinning to
  # a SHA without an updater trades a mutable-tag risk for a frozen-pin risk;
  # this entry is the half that makes the pins maintained rather than frozen.
  #
  # Its acceptance test is a PR, not a green job log: wait for an upstream
  # action to publish a release and confirm a PR appears rewriting both the SHA
  # and its trailing version comment. A successful run with no PR, while an
  # upstream tag has demonstrably advanced, means this entry is not working.
  # Observed working: #192, #193, #196, #197.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
