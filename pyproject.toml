[build-system]
requires = ["setuptools>=69.0.2", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-risk-profiler"
dynamic = ["version"]
description = "A tool to evaluate the health and risk of a project's dependencies beyond vulnerability scanning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "William Zujkowski", email = "williamzujkowski@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.32.2",  # Fixed CVE-2024-35195
    "packaging>=23.2",
    "colorama>=0.4.6;platform_system=='Windows'",
    "pyyaml>=6.0.1",
    "cryptography>=42.0.0",  # For secure code signing, Fixed CVE-2023-50782 & others
    "urllib3>=2.2.2",     # Fixed CVE-2024-37891
    "jinja2>=3.1.5",      # Fixed CVE-2024-56201
    "certifi>=2024.7.4",  # Fixed CVE-2024-39689
    "werkzeug>=3.0.6",    # Fixed CVE-2024-49766, CVE-2024-49767
    "tomli>=2.0.1",  # TOML parsing (make available for all Python versions for testing)
    "pygments>=2.16.1",   # Fixed CVE-2023-41337
    "typer>=0.9.0",       # CLI framework for better user experience
    "rich>=13.5.0",       # For rich terminal output and progress bars
    "aiohttp>=3.8.6",     # For async HTTP requests
    "httpx>=0.24.1",      # Modern HTTP client with sync and async support
    "pipdeptree>=2.13.0", # For enhanced Python transitive dependency analysis
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.2.0",
    "pytest-benchmark>=4.0.0",  # For performance benchmark tests
    "pytest-asyncio>=0.21.1",   # For testing async code
    "black>=24.4.0",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.9.0",
    "responses>=0.25.0",        # For HTTP mocking in tests
    "aiohttp>=3.8.6,<3.14",     # Keep aioresponses mocks compatible in tests
    "aioresponses>=0.7.9",      # For mocking async HTTP requests
    "tomli>=2.0.1",  # TOML parsing/writing in tests (make available for all Python versions)
    "tomli-w>=1.0.0",           # For TOML writing in tests
    "pre-commit>=3.5.0",        # For pre-commit hooks
    # test-only percentile helper. Capped below 2.5 because numpy 2.5 ships
    # PEP 695 `type` statements in its stubs, which are a hard parse failure
    # under `[tool.mypy] python_version = "3.10"`; raise both together.
    "numpy>=1.24.0,<2.5",
]

benchmark = [
    "numpy>=1.24.0,<2.5",      # Percentile calculations; capped, see the dev extra
]

visualization = [
    "graphviz>=0.20.1",        # For dependency graph visualization
    "python-igraph>=0.10.4",   # Alternative graph visualization
    # Not imported by the package itself — only optional graph/plot rendering
    # (examples/). Kept out of the default install to shrink the CVE surface.
    "matplotlib>=3.7.0",
    "networkx>=2.8.8",
    "pillow>=10.2.0",          # matplotlib image backend; CVE-2023-50447 floor
]

docs = [
    "mkdocs>=1.6.0",           # Documentation site generator
    "mkdocs-material>=9.6.0",  # Material theme for MkDocs
    "pymdown-extensions>=10.14.0", # Markdown extensions for MkDocs
]

[project.urls]
Homepage = "https://github.com/williamzujkowski/dependency-risk-profiler"
Issues = "https://github.com/williamzujkowski/dependency-risk-profiler/issues"

[project.scripts]
dependency-risk-profiler = "dependency_risk_profiler.cli.typer_cli:main"

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
# The repo bans `# type: ignore`; this makes a suppression that has stopped
# being load-bearing fail the gate instead of quietly becoming cargo cult.
warn_unused_ignores = true
# `testing/` is checked (see testing/unit/test_mypy_config.py, which ratchets
# its error count). Only `testing/projects/` is excluded: that is a vendored
# upstream checkout used as parser input, not code this repo owns.
exclude = [
    "testing/projects/",
    "venv/",
    "build/",
    "dist/",
    "setup.py"
]

# Temporarily ignore errors in certain modules
[[tool.mypy.overrides]]
module = "enum"
strict_optional = false

[[tool.mypy.overrides]]
module = "dataclasses"
strict_optional = false

# Ignore import errors for third-party libraries
[[tool.mypy.overrides]]
module = "tomli.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiohttp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "typer.*"
ignore_missing_imports = true

# numpy ships `py.typed`, so mypy reads its stubs. Nothing here depends on
# their contents — the test suite calls `percentile` and nothing else — and
# following them costs a full stub parse, so skip it. (The version cap in the
# dev extra is the separate half of this: `follow_imports` cannot rescue a
# stub whose *syntax* postdates our `python_version`.)
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

# There are deliberately no `ignore_errors` overrides for first-party modules.
# There used to be eleven (#143); the last three went in #154. `src` type-checks
# clean, and testing/unit/test_mypy_config.py fails the build if a new mask
# appears without a ratchet entry. Fix the errors instead of adding one back.

[tool.pytest.ini_options]
testpaths = ["testing/unit", "testing/integration"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "benchmark: marks tests as performance benchmarks",
    "asyncio: mark test to run using asyncio",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=src --cov-report=xml --cov-report=html"

# The coverage floor lives here, not in `[tool.pytest.ini_options]`. That
# section carried `cov_fail_under = 90` from 2025-04 to #228 — not a pytest
# option, not a pytest-cov option, not a coverage option. pytest warned
# `Unknown config option: cov_fail_under` on every run, CI ran plain
# `pytest --cov=src` with no `--cov-fail-under`, and nothing anywhere read the
# key. The 90% bar was never enforced; real coverage was 82.8%.
#
# `fail_under` below is the honest measured number, floored to leave room for
# cross-version drift. Measured on the CI matrix at #228:
#
#   3.9  82.86%   (1951 of 11384 statements missed)
#   3.10 82.89%   (1949 of 11388)
#   3.11 82.81%   (1958 of 11388)  <- the minimum; the floor is set from this
#   3.12 82.82%   (1957 of 11388)
#
# Spread is 0.08pt, so 82.5 gives ~0.3pt of headroom: enough that a normal run
# cannot flake below it, tight enough that deleting a covered module fails CI.
# `precision = 2` makes the comparison mean what it says — at the default
# precision of 0 a floor of "83" is really a floor of 82.5 via rounding, which
# is how a bar ends up stricter or looser than anyone wrote down.
#
# **The target is 90% (#235).** This floor is a ratchet and it only tightens:
# raise it as coverage rises, never lower it to make a red build green.
[tool.coverage.report]
fail_under = 82.5
precision = 2

[tool.setuptools]
packages = {find = {where = ["src"]}}
package-dir = {"" = "src"}
include-package-data = true

# PEP 561. Without this marker the package ships as untyped: every consumer —
# including this repo's own test suite — sees `Any` for every symbol, which is
# how 250 of the first mypy errors in `testing/` turned out to be one missing
# empty file (#156).
[tool.setuptools.package-data]
dependency_risk_profiler = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "dependency_risk_profiler.__version__"}

[tool.ruff]
target-version = "py39"
line-length = 88
exclude = ["testing/projects/*", "**/testing/projects/*"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E203"]
per-file-ignores = {"src/dependency_risk_profiler/cli/typer_cli.py" = ["B008"]}

[tool.ruff.lint.isort]
known-first-party = ["dependency_risk_profiler"]

# There is deliberately no `[tool.flake8]` section. flake8 has no pyproject.toml
# support, so such a section is read by nothing unless the flake8-pyproject
# plugin is installed, which it is not. One lived here from 2025-04 to #228,
# complete with six exclusions pointing through the `tests` symlink — and every
# line of it was inert. `.flake8` is the live config; CI
# runs `flake8 --config=.flake8`. testing/unit/test_ci_configs.py fails the
# build if a `[tool.flake8]` section reappears without the plugin to read it.
